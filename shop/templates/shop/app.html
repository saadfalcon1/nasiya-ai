<style>
:root {
  --bg: var(--tg-theme-secondary-bg-color, #f1f2f6);
  --card: var(--tg-theme-section-bg-color, var(--tg-theme-bg-color, #ffffff));
  --text: var(--tg-theme-text-color, #111318);
  --hint: var(--tg-theme-hint-color, #8b919c);
  --link: var(--tg-theme-link-color, #2b7de9);
  --accent: var(--tg-theme-button-color, #2b7de9);
  --accent-text: var(--tg-theme-button-text-color, #ffffff);
  --sep: rgba(128, 132, 145, .18);
  --cash: #2b7de9;
  --credit: #f2a60d;
  --good: #1aa260;
  --bad: #e5484d;
  --warn: #f2a60d;
  --muted-bg: rgba(128, 132, 145, .12);
  --radius: 14px;
  --nav-h: 62px;
}
:root[data-theme="dark"] {
  --bg: #0f1115; --card: #1b1e24; --text: #f2f3f5; --hint: #8a909b; --link: #5ea3ff;
  --accent: #3b8cf0; --sep: rgba(255,255,255,.08); --muted-bg: rgba(255,255,255,.07);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
body { padding-bottom: calc(var(--nav-h) + env(safe-area-inset-bottom)); overflow-x: hidden; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
input { font: inherit; color: var(--text); }
.wrap { max-width: 640px; margin: 0 auto; padding: 12px 16px 24px; }
.hidden { display: none !important; }

/* header */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 4px 2px 12px; }
.top h1 { font-size: 20px; margin: 0; font-weight: 700; letter-spacing: -.2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.top .sub { color: var(--hint); font-size: 13px; }

/* segmented */
.seg { display: inline-flex; background: var(--muted-bg); border-radius: 10px; padding: 3px; flex-shrink: 0; }
.seg button { padding: 6px 11px; border-radius: 8px; font-size: 13px; font-weight: 600; color: var(--hint); }
.seg button.on { background: var(--card); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.08); }

/* cards */
.card { background: var(--card); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 12px; }
.card h3 { margin: 0 0 10px; font-size: 13px; font-weight: 600; color: var(--hint); text-transform: uppercase; letter-spacing: .4px; }
.hero .label { color: var(--hint); font-size: 13px; }
.hero .big { font-size: 32px; font-weight: 750; letter-spacing: -.8px; line-height: 1.15; margin: 2px 0 8px; font-variant-numeric: tabular-nums; }
.hero .big small { font-size: 15px; font-weight: 600; color: var(--hint); letter-spacing: 0; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 650; vertical-align: middle; }
.chip.up { background: rgba(26,162,96,.13); color: var(--good); }
.chip.down { background: rgba(229,72,77,.13); color: var(--bad); }
.split { display: flex; gap: 16px; flex-wrap: wrap; font-size: 14px; }
.split span b { font-variant-numeric: tabular-nums; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
.bar100 { display: flex; height: 6px; border-radius: 4px; overflow: hidden; background: var(--muted-bg); margin-top: 10px; }
.bar100 i { display: block; height: 100%; }

.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 12px; }
.tile { background: var(--card); border-radius: var(--radius); padding: 12px; min-width: 0; text-align: left; }
.tile .k { color: var(--hint); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile .v { font-size: 17px; font-weight: 700; margin-top: 2px; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile .s { color: var(--hint); font-size: 11.5px; margin-top: 1px; }
.tile.link .v { color: var(--link); }

/* chart */
.chart { position: relative; }
.chart svg { display: block; width: 100%; height: 170px; }
.chart .tip { min-height: 20px; font-size: 13px; color: var(--hint); margin-top: 6px; font-variant-numeric: tabular-nums; }
.chart .tip b { color: var(--text); }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--hint); margin-top: 2px; }

/* lists */
.list { background: var(--card); border-radius: var(--radius); overflow: hidden; margin-bottom: 12px; }
.row { display: flex; align-items: center; gap: 12px; padding: 11px 16px; position: relative; width: 100%; text-align: left; }
.row + .row::before { content: ""; position: absolute; top: 0; left: 64px; right: 0; height: 1px; background: var(--sep); }
.row.noav + .row.noav::before { left: 16px; }
.row .main { flex: 1; min-width: 0; }
.row .t { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .d { color: var(--hint); font-size: 13px; margin-top: 1px; display: flex; flex-wrap: wrap; gap: 4px 8px; }
.row .amt { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; text-align: right; }
.row .amt small { display: block; font-weight: 500; font-size: 12px; color: var(--hint); }
.av { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; color: #fff; flex-shrink: 0; font-size: 15px; }
.ic { width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; font-size: 19px; flex-shrink: 0; background: var(--muted-bg); }
.tag { font-size: 11.5px; font-weight: 650; padding: 1px 7px; border-radius: 6px; background: var(--muted-bg); color: var(--hint); white-space: nowrap; }
.tag.red { background: rgba(229,72,77,.13); color: var(--bad); }
.tag.amber { background: rgba(242,166,13,.15); color: #c98400; }
.tag.green { background: rgba(26,162,96,.13); color: var(--good); }
.tag.blue { background: rgba(43,125,233,.13); color: var(--cash); }
.pos { color: var(--good); } .neg { color: var(--bad); } .cr { color: #c98400; }

.tips .tipc { background: var(--card); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 8px; font-size: 14px; line-height: 1.45; }
.tips .tipc b { font-weight: 650; }

.search { width: 100%; padding: 10px 14px; border-radius: 12px; border: 0; background: var(--card); outline: none; margin-bottom: 10px; }
.chips { display: flex; gap: 8px; overflow-x: auto; margin: 0 -16px 12px; padding: 0 16px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chips button { padding: 7px 12px; border-radius: 999px; background: var(--card); font-size: 13px; font-weight: 600; white-space: nowrap; color: var(--hint); }
.chips button.on { background: var(--accent); color: var(--accent-text); }
.toggle { display: flex; align-items: center; justify-content: space-between; color: var(--hint); font-size: 13px; margin: -2px 2px 10px; }
.toggle button { color: var(--link); font-weight: 600; font-size: 13px; }

.meter { height: 5px; border-radius: 3px; background: var(--muted-bg); overflow: hidden; margin-top: 6px; }
.meter i { display: block; height: 100%; border-radius: 3px; }

.btn { display: flex; align-items: center; justify-content: center; gap: 6px; width: 100%; padding: 12px; border-radius: 12px;
  background: var(--accent); color: var(--accent-text); font-weight: 650; }
.btn.ghost { background: var(--muted-bg); color: var(--text); }
.btn:disabled { opacity: .55; }
.btns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
.btns .btn { flex-direction: column; gap: 2px; padding: 10px 6px; font-size: 13px; }
.btns .btn span { font-size: 20px; }
.more { display: block; margin: 0 auto 12px; color: var(--link); font-weight: 600; padding: 8px 16px; }

.empty { text-align: center; color: var(--hint); padding: 32px 16px; }
.empty .e { font-size: 40px; margin-bottom: 6px; }

/* nav */
nav { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--sep);
  display: flex; padding-bottom: env(safe-area-inset-bottom); z-index: 10; }
nav button { flex: 1; height: var(--nav-h); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  font-size: 11px; font-weight: 600; color: var(--hint); }
nav button .i { font-size: 21px; line-height: 1; filter: grayscale(1); opacity: .7; }
nav button.on { color: var(--accent); }
nav button.on .i { filter: none; opacity: 1; }

/* sheet */
.sheet { position: fixed; inset: 0; background: var(--bg); z-index: 20; overflow-y: auto; transform: translateX(100%);
  transition: transform .22s ease; padding-bottom: env(safe-area-inset-bottom); }
.sheet.open { transform: none; }
.sheet .bar { position: sticky; top: 0; background: var(--bg); display: flex; align-items: center; gap: 8px; padding: 10px 12px; z-index: 2; }
.sheet .bar button { color: var(--link); font-weight: 600; padding: 4px 6px; }
.field { display: flex; align-items: center; gap: 10px; padding: 10px 16px; }
.field + .field { border-top: 1px solid var(--sep); }
.field label { width: 92px; color: var(--hint); font-size: 14px; flex-shrink: 0; }
.field input { flex: 1; min-width: 0; border: 0; background: none; outline: none; padding: 4px 0; }
.err { color: var(--bad); font-size: 12px; padding: 0 16px 8px; }
.quote { background: var(--muted-bg); border-left: 3px solid var(--accent); border-radius: 8px; padding: 10px 12px; white-space: pre-wrap; font-size: 14px; margin: 8px 0 12px; }
.note { color: var(--hint); font-size: 13px; line-height: 1.45; }

.toast { position: fixed; left: 50%; bottom: calc(var(--nav-h) + 16px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(20px);
  background: rgba(20,22,28,.92); color: #fff; padding: 10px 16px; border-radius: 12px; font-size: 14px; opacity: 0;
  transition: .2s; z-index: 50; max-width: calc(100% - 32px); text-align: center; pointer-events: none; }
.toast.show { opacity: 1; transform: translateX(-50%); }

.sk { background: linear-gradient(90deg, var(--muted-bg), rgba(128,132,145,.2), var(--muted-bg)); background-size: 200% 100%;
  animation: sk 1.2s infinite; border-radius: var(--radius); }
@keyframes sk { to { background-position: -200% 0; } }

.review { display: flex; gap: 8px; margin-top: 8px; }
.review button { flex: 1; padding: 8px; border-radius: 10px; font-weight: 650; font-size: 14px; }
.review .yes { background: rgba(26,162,96,.13); color: var(--good); }
.review .no { background: rgba(229,72,77,.12); color: var(--bad); }
.items { color: var(--hint); font-size: 13px; }
.langbtn { padding: 6px 10px; border-radius: 10px; background: var(--muted-bg); font-size: 13px; font-weight: 700; color: var(--hint); flex-shrink: 0; }
.langmenu { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.25); display: flex; align-items: flex-start; justify-content: flex-end; padding: 56px 16px; }
.langmenu .box { background: var(--card); border-radius: 14px; overflow: hidden; min-width: 190px; box-shadow: 0 8px 30px rgba(0,0,0,.18); }
.langmenu button { display: block; width: 100%; text-align: left; padding: 13px 16px; font-size: 15px; }
.langmenu button + button { border-top: 1px solid var(--sep); }
.langmenu button.on { color: var(--accent); font-weight: 700; }
.top .right { display: flex; gap: 8px; align-items: center; }
</style>
{% endverbatim %}
</head>

<div class="wrap" id="root">
  <div class="sk" style="height:28px;width:55%;margin:6px 0 16px"></div>
  <div class="sk" style="height:140px;margin-bottom:12px"></div>
  <div class="sk" style="height:70px;margin-bottom:12px"></div>
  <div class="sk" style="height:200px"></div>
</div>

<nav id="nav" class="hidden"></nav>

<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>

const LANG_NAMES = { uz: "🇺🇿 O'zbekcha", ru: "🇷🇺 Русский", en: "🇬🇧 English" };
let LANG = (qs.get("lang") in I18N && qs.get("lang")) || "uz";
const t = (key, vars) => {
  let s = (I18N[LANG] && I18N[LANG][key]) ?? I18N.uz[key] ?? key;
  if (vars) for (const k in vars) s = s.split("{" + k + "}").join(vars[k]);
  return s;
};
const U = u => u ? t("u_" + u) === "u_" + u ? u : t("u_" + u) : "";

const $ = (s, el = document) => el.querySelector(s);
const root = $("#root"), sheet = $("#sheet"), nav = $("#nav");
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const money = n => n == null ? "—" : Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, " ");
const som = n => `${money(n)} ${t("som")}`;
const short = n => {
  if (n == null) return "—";
  const a = Math.abs(n);
  if (a >= 1e9) return (n / 1e9).toFixed(1).replace(".0", "") + " " + t("mlrd");
  if (a >= 1e6) return (n / 1e6).toFixed(a >= 1e7 ? 0 : 1).replace(".0", "") + " " + t("mln");
  if (a >= 1e4) return Math.round(n / 1e3) + " " + t("ming");
  return money(n);
};
const qty = n => (Math.round(n * 100) / 100).toString();
const haptic = (k = "light") => { try { k === "success" || k === "error" || k === "warning" ? tg.HapticFeedback.notificationOccurred(k) : tg.HapticFeedback.impactOccurred(k); } catch (e) {} };
let toastTimer;
function toast(msg) { const el = $("#toast"); el.textContent = msg; el.classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove("show"), 2400); }
const H3 = txt => `<h3 style="margin:16px 4px 8px;font-size:13px;color:var(--hint);text-transform:uppercase;letter-spacing:.4px">${txt}</h3>`;

async function api(path, opts = {}) {
  let url = "/api" + path;
  if (DEV_AS) url += (url.includes("?") ? "&" : "?") + "as=" + encodeURIComponent(DEV_AS);
  const r = await fetch(url, {
    method: opts.method || "GET",
    headers: { "X-Telegram-Init-Data": (tg && tg.initData) || "", "Content-Type": "application/json" },
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(data.error || ("HTTP " + r.status)); e.status = r.status; e.data = data; throw e; }
  return data;
}

const COLORS = ["#e17076", "#7bc862", "#e5ca77", "#65aadd", "#a695e7", "#ee7aae", "#6ec9cb", "#faa774"];
const avatar = (name, size) => {
  let h = 0; for (const ch of name) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  const dim = size ? `width:${size}px;height:${size}px;font-size:${Math.round(size * .4)}px;` : "";
  return `<div class="av" style="${dim}background:${COLORS[h % COLORS.length]}">${esc(name.trim()[0] || "?").toUpperCase()}</div>`;
};
const delta = d => d == null ? "" : `<span class="chip ${d >= 0 ? "up" : "down"}">${d >= 0 ? "▲" : "▼"} ${Math.abs(Math.round(d))}%</span>`;

function fatal(title, text) {
  nav.classList.add("hidden");
  root.innerHTML = `<div class="empty" style="padding-top:80px"><div class="e">🏪</div><h2 style="margin:6px 0">${esc(title)}</h2><div class="note">${text}</div></div>`;
}

/* ---------- til almashtirgich ---------- */
const langBtn = () => `<button class="langbtn" id="langBtn" aria-label="${t("lang")}">🌐 ${LANG.toUpperCase()}</button>`;
function bindLang(onChange) {
  const b = $("#langBtn"); if (!b) return;
  b.onclick = () => {
    haptic();
    const m = document.createElement("div");
    m.className = "langmenu";
    m.innerHTML = `<div class="box">${Object.keys(LANG_NAMES).map(k => `<button data-l="${k}" class="${k === LANG ? "on" : ""}">${LANG_NAMES[k]}</button>`).join("")}</div>`;
    m.onclick = async e => {
      const x = e.target.closest("button"); m.remove();
      if (!x || x.dataset.l === LANG) return;
      LANG = x.dataset.l; haptic("success");
      try { await api("/me", { method: "POST", body: { lang: LANG } }); } catch (err) {}
      onChange();
    };
    document.body.appendChild(m);
  };
}

const S = { tab: "home", period: "bugun", dash: null, debt: null, debtSort: "sum", debtAll: false, debtQ: "",
  stock: null, stockF: "all", hist: [], histNext: 0, histKind: "", shop: "" };

function header(title, sub, right = "") {
  return `<div class="top"><div style="min-width:0"><h1>${esc(title)}</h1>${sub ? `<div class="sub">${sub}</div>` : ""}</div><div class="right">${right}${langBtn()}</div></div>`;
}

function renderNav() {
  nav.innerHTML = [["home", "🏠", "nav_home"], ["debtors", "👥", "nav_debt"], ["stock", "📦", "nav_stock"], ["history", "🧾", "nav_hist"]]
    .map(([k, i, l]) => `<button data-tab="${k}" class="${S.tab === k ? "on" : ""}"><span class="i">${i}</span>${t(l)}</button>`).join("");
}

function setTab(tab) {
  S.tab = tab;
  nav.querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.tab === tab));
  window.scrollTo(0, 0);
  render();
}
nav.addEventListener("click", e => { const b = e.target.closest("button"); if (b) { haptic(); setTab(b.dataset.tab); } });

async function render() {
  const tab = S.tab;
  try {
    if (tab === "home") await renderHome();
    else if (tab === "debtors") await renderDebtors();
    else if (tab === "stock") await renderStock();
    else await renderHistory(true);
  } catch (e) { showError(e); }
  bindLang(() => { renderNav(); render(); });
}

function showError(e) {
  if (e.status === 401) return fatal(t("open_tg"), t("open_tg_t"));
  root.innerHTML = `<div class="empty"><div class="e">⚠️</div>${t("load_fail")}<br><button class="more" id="retry">${t("retry")}</button></div>`;
  $("#retry").onclick = render;
}

function drawChart(el, series) {
  const W = Math.max(280, el.clientWidth || 320), H = 170, padB = 22, padT = 18, padR = 40;
  const max = Math.max(1, ...series.map(s => s.naqd + s.nasiya));
  const n = series.length, gap = n > 20 ? 2 : 5, bw = (W - padR - gap * (n - 1)) / n;
  const y = v => (H - padB) - v / max * (H - padB - padT);
  let bars = "", labels = "", line = [];
  series.forEach((s, i) => {
    const x = i * (bw + gap);
    const hC = (H - padB) - y(s.naqd), hN = (H - padB) - y(s.nasiya);
    bars += `<g data-i="${i}" style="cursor:pointer"><rect x="${x}" y="${padT}" width="${bw}" height="${H - padB - padT}" fill="transparent"/>
      <rect x="${x}" y="${y(s.naqd)}" width="${bw}" height="${Math.max(0, hC)}" rx="2" fill="var(--cash)"/>
      <rect x="${x}" y="${y(s.naqd) - hN}" width="${bw}" height="${Math.max(0, hN)}" rx="2" fill="var(--credit)"/></g>`;
    if (n <= 14 || i % 3 === 0 || i === n - 1) labels += `<text x="${i === 0 ? x : x + bw / 2}" y="${H - 6}" text-anchor="${i === 0 ? "start" : "middle"}" font-size="10" fill="var(--hint)">${s.label}</text>`;
    line.push(`${x + bw / 2},${y(Math.max(0, s.profit))}`);
  });
  const grid = [0.5, 1].map(f => `<line x1="0" x2="${W - padR + 4}" y1="${y(max * f)}" y2="${y(max * f)}" stroke="var(--sep)" stroke-dasharray="3 3"/>
     <text x="${W}" y="${y(max * f) + 3}" text-anchor="end" font-size="10" fill="var(--hint)">${short(max * f)}</text>`).join("");
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${bars}${grid}
    <polyline points="${line.join(" ")}" fill="none" stroke="var(--good)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" pointer-events="none"/>${labels}</svg>`;
  el.querySelectorAll("g[data-i]").forEach(g => g.onclick = () => {
    const s = series[+g.dataset.i]; haptic();
    el.querySelectorAll("g[data-i]").forEach(o => o.style.opacity = o === g ? 1 : .45);
    $("#tip").innerHTML = t("tip_line", { d: s.label, w: s.weekday, s: money(s.naqd + s.nasiya), c: money(s.naqd), n: money(s.nasiya), p: money(s.profit) });
  });
}

async function renderDebtors(reload = true) {
  if (reload || !S.debt) S.debt = await api("/debtors" + (S.debtAll ? "?all=1" : ""));
  const d = S.debt;
  let rows = d.customers.filter(c => !S.debtQ || c.name.toLowerCase().includes(S.debtQ.toLowerCase()));
  if (S.debtSort === "late") rows = rows.slice().sort((a, b) => (b.days_since_pay ?? -1) - (a.days_since_pay ?? -1));
  if (S.debtSort === "promise") rows = rows.filter(c => c.promise).sort((a, b) => b.promise.late - a.promise.late);

  const list = rows.length ? `<div class="list">${rows.map(c => {
    const tags = [];
    if (c.promise) tags.push(c.promise.late > 0 ? `<span class="tag red">🤝 ${t("late_days", { n: c.promise.late })}</span>` :
      c.promise.late === 0 ? `<span class="tag amber">🤝 ${t("today")}</span>` : `<span class="tag">🤝 ${esc(c.promise.due)}</span>`);
    if (c.overdue) tags.push(`<span class="tag red">${t("t_days", { n: c.days_since_pay })}</span>`);
    else if (c.days_since_pay != null && c.balance > 0) tags.push(`<span>${t("days_ago", { n: c.days_since_pay })}</span>`);
    if (c.over_limit) tags.push(`<span class="tag amber">${t("t_limit")}</span>`);
    if (c.disputed) tags.push(`<span class="tag red">${t("t_disputed")}</span>`);
    if (c.linked) tags.push(`<span class="tag blue">📱</span>`);
    return `<button class="row" data-cust="${c.id}">${avatar(c.name)}<div class="main"><div class="t">${esc(c.name)}</div>
      <div class="d">${tags.join("")}</div></div><div class="amt ${c.balance > 0 ? "" : "pos"}">${money(c.balance)}<small>${t("som")}</small></div></button>`;
  }).join("")}</div>` : `<div class="empty"><div class="e">${S.debtQ ? "🔍" : "🎉"}</div>${S.debtQ ? t("not_found") : S.debtSort === "promise" ? t("no_promises") : t("no_debtors")}</div>`;

  const focused = document.activeElement && document.activeElement.id === "q";
  root.innerHTML = header(t("debtors"), t("debt_sub", { amt: som(d.outstanding), n: d.count })) + `
    <input class="search" id="q" placeholder="${t("search")}" value="${esc(S.debtQ)}" autocomplete="off">
    <div class="chips" id="sort">${[["sum", "s_sum"], ["late", "s_late"], ["promise", "s_prom"]].map(([v, l]) =>
      `<button data-s="${v}" class="${S.debtSort === v ? "on" : ""}">${t(l)}</button>`).join("")}</div>
    <div class="toggle"><span>${S.debtAll ? t("all_c") : t("only_debt")}</span><button id="all">${S.debtAll ? t("show_debtors") : t("show_all")}</button></div>
    ${list}`;
  const q = $("#q");
  q.oninput = () => { S.debtQ = q.value; renderDebtors(false); bindLang(() => { renderNav(); render(); }); };
  if (focused) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); }
  $("#sort").onclick = e => { const b = e.target.closest("button"); if (b) { haptic(); S.debtSort = b.dataset.s; renderDebtors(false); bindLang(() => { renderNav(); render(); }); } };
  $("#all").onclick = () => { S.debtAll = !S.debtAll; render(); };
  root.querySelectorAll("[data-cust]").forEach(b => b.onclick = () => openCustomer(+b.dataset.cust));
}

const STOCK_TAGS = { low: ["red", "st_low"], negative: ["red", "st_neg"], loss: ["red", "st_loss"], slow: ["amber", "st_slow"], daily: ["blue", "st_daily"], ok: ["green", null] };
async function renderStock(reload = true) {
  if (reload || !S.stock) S.stock = await api("/stock");
  const d = S.stock;
  const counts = { low: 0, slow: 0, loss: 0 };
  d.products.forEach(p => { if (p.status === "negative") counts.low++; else if (counts[p.status] != null) counts[p.status]++; });
  const F = S.stockF;
  const rows = d.products.filter(p => F === "all" || p.status === F || (F === "low" && p.status === "negative"));
  const list = rows.length ? `<div class="list">${rows.map(p => {
    const [cls, key] = STOCK_TAGS[p.status];
    const days = p.days_left;
    const pct = days == null ? (p.status === "slow" ? 100 : 0) : Math.min(100, days / 14 * 100);
    const color = p.status === "low" || p.status === "negative" ? "var(--bad)" : p.status === "slow" ? "var(--warn)" : "var(--good)";
    const info = [];
    if (p.daily) info.push(t("daily_comes"));
    else if (days != null) info.push(t("days_left", { n: Math.round(days) }));
    if (p.avg) info.push(t("per_day", { v: qty(p.avg), u: U(p.unit) }));
    if (p.frozen) info.push(`<b class="cr">${t("frozen", { v: som(p.frozen) })}</b>`);
    const marg = p.margin_pct != null ? `<small class="${p.margin_pct < 0 ? "neg" : ""}">${t("margin", { v: (p.margin_pct > 0 ? "+" : "") + p.margin_pct })}</small>` : "<small>&nbsp;</small>";
    return `<div class="row noav" style="align-items:flex-start"><div class="main">
      <div class="t">${esc(p.name)} <span class="tag ${cls}" style="margin-left:4px">${key ? t(key) : "✓"}</span></div>
      <div class="d">${info.join(" · ")}</div>
      ${p.daily ? "" : `<div class="meter"><i style="width:${pct}%;background:${color}"></i></div>`}
      ${p.cost != null || p.sell != null ? `<div class="d" style="margin-top:4px">${t("cost_sell", { c: money(p.cost), s: money(p.sell) })}</div>` : ""}</div>
      <div class="amt">${qty(p.stock)} ${esc(U(p.unit))}${marg}</div></div>`;
  }).join("")}</div>` : `<div class="empty"><div class="e">📦</div>${d.products.length ? t("none_here") : t("stock_empty")}</div>`;

  const sh = d.shelf;
  const line = h => `<div class="d" style="color:var(--text);margin-top:4px">${h}</div>`;
  const shelfCard = sh ? `<div class="card"><h3>${t("shelf")} · ${esc(sh.date)}</h3>

      ${sh.unrecorded.length ? `<div style="margin-top:10px"><b class="neg">${t("unrec")}</b> <span class="note">${t("vs_photo", { t: esc(sh.prev_time) })}</span>
        ${sh.unrecorded.map(u => line(t("unrec_row", { name: esc(u.name), p: qty(u.photo_sold), r: qty(u.recorded), g: qty(u.gap), u: esc(U(u.unit)) }) + (u.money ? ` (~${som(u.money)})` : ""))).join("")}</div>`
        : sh.has_prev ? `<div class="note pos" style="margin-top:8px">${t("matches")}</div>` : ""}
      ${sh.low.length ? `<div style="margin-top:10px"><b>${t("shelf_low")}</b>${sh.low.map(x => line(`• ${esc(x.name)}: ${qty(x.count)} ${esc(U(x.unit))} — ${x.reorder ? `<b class="neg">${t("none_storage")}</b>` : t("in_storage", { v: qty(x.stock) })}`)).join("")}</div>` : ""}
      ${sh.missing.length ? `<div class="note" style="margin-top:8px">${t("not_seen", { list: sh.missing.map(esc).join(", ") })}</div>` : ""}
      ${sh.unknown.length ? `<div class="note" style="margin-top:8px">${t("not_in_db", { list: sh.unknown.map(esc).join(", ") })}</div>` : ""}
      ${sh.observations.length ? `<div class="note" style="margin-top:8px">🧠 ${sh.observations.map(esc).join("<br>🧠 ")}</div>` : ""}

    ${list}${S.histNext != null ? `<button class="more" id="more">${t("more")}</button>` : ""}`;
  $("#hk").onclick = e => { const b = e.target.closest("button"); if (b) { haptic(); S.histKind = b.dataset.k; render(); } };
  if ($("#more")) $("#more").onclick = () => renderHistory(false).then(() => bindLang(() => { renderNav(); render(); })).catch(showError);
  root.querySelectorAll("[data-cust]").forEach(b => { b.style.cursor = "pointer"; b.onclick = () => openCustomer(+b.dataset.cust); });
}

/* ================= MIJOZ ================= */
async function renderMy() {
  const d = await api("/my");
  LANG = d.lang in I18N ? d.lang : LANG;
  const pending = d.transactions.filter(x => x.can_review).length;
  const st = { confirmed: `<span class="tag green">${t("c_confirmed")}</span>`, disputed: `<span class="tag red">${t("c_disputed")}</span>` };
  root.innerHTML = header(d.shop, t("hello", { name: esc(d.name) })) + `
    <div class="card hero"><div class="label">${t("your_debt")}</div><div class="big ${d.balance <= 0 ? "pos" : ""}">${money(d.balance)} <small>${t("som")}</small></div>
      ${d.promise ? `<div class="note">${t("pay_day", { d: esc(d.promise.due) })}${d.promise.amount ? ` · ${som(d.promise.amount)}` : ""}${d.promise.late > 0 ? ` <span class="tag red">${t("days_passed", { n: d.promise.late })}</span>` : ""}</div>` : ""}
      ${d.balance <= 0 ? `<div class="note">${t("no_debt")}</div>` : ""}</div>
    ${pending ? `<div class="card note">${t("pending", { n: pending })}</div>` : ""}
    ${H3(t("history"))}
    ${d.transactions.length ? `<div class="list">${d.transactions.map(x => `<div class="row noav" style="align-items:flex-start" id="tx${x.id}">
      <div class="ic">${x.icon}</div><div class="main"><div class="t">${x.kind === "tolov" ? t("c_payment") : t("c_credit")} ${st[x.status] || ""}</div>
      <div class="items">${x.items.length ? esc(x.items.map(i => `${i.name} ${qty(i.qty)} ${U(i.unit)}`).join(", ")) : ""}</div><div class="d">${x.date}</div>
      ${x.can_review ? `<div class="review"><button class="yes" data-r="confirmed" data-id="${x.id}">${t("correct")}</button><button class="no" data-r="disputed" data-id="${x.id}">${t("wrong")}</button></div>` : ""}</div>
      <div class="amt ${x.kind === "tolov" ? "pos" : "cr"}">${x.kind === "tolov" ? "−" : "+"}${money(x.amount)}</div></div>`).join("")}</div>`
      : `<div class="empty">${t("no_records")}</div>`}
    <div class="note" style="text-align:center;margin-top:16px">${t("questions")}<br>Nasiya AI 🤝</div>`;
  bindLang(() => renderMy().catch(showError));
  root.querySelectorAll("[data-r]").forEach(b => b.onclick = async () => {
    const status = b.dataset.r;
    if (status === "disputed" && tg && tg.showConfirm) {
      const ok = await new Promise(res => tg.showConfirm(t("confirm_dispute"), res));
      if (!ok) return;
    }
    try { await api("/my/tx/" + b.dataset.id, { method: "POST", body: { status } }); haptic(status === "confirmed" ? "success" : "warning");
      toast(status === "confirmed" ? t("thanks") : t("shop_told")); renderMy(); }
    catch (e) { toast(t("error")); }
  });
}

/* ================= START ================= */
(async function start() {
  try {
    const me = await api("/me");
    if (me.lang in I18N) LANG = me.lang;
    if (me.role === "customer") { await renderMy(); return; }
    renderNav();
    nav.classList.remove("hidden");
    await render();
  } catch (e) {
    if (e.status === 401) fatal(t("open_tg"), t("open_tg_t"));
    else if (e.status === 403) fatal(t("reg_first"), t("reg_first_t"));
    else showError(e);
  }
})();
</script>
